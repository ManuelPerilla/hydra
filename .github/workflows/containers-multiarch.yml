name: Publish native multi-architecture containers
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event.repository.private == false
    uses: ./.github/workflows/ci.yml
  build:
    if: github.event.repository.private == false
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, agent, web]
        architecture: [amd64, arm64]
        include:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image and context
        id: image
        env: {HYDRA_COMPONENT: '${{ matrix.component }}'}
        run: |
          hydra_image="ghcr.io/${GITHUB_REPOSITORY,,}/$HYDRA_COMPONENT"
          hydra_context="apps/$HYDRA_COMPONENT"
          if [ "$HYDRA_COMPONENT" = agent ]; then hydra_context=apps/chaos-agent; fi
          printf 'name=%s\ncontext=%s\n' "$hydra_image" "$hydra_context" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: ${{ steps.image.outputs.context }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Save digest only
        env:
          HYDRA_DIGEST: ${{ steps.build.outputs.digest }}
          HYDRA_COMPONENT: ${{ matrix.component }}
          HYDRA_ARCH: ${{ matrix.architecture }}
        run: |
          mkdir -p "$RUNNER_TEMP/hydra-digests"
          printf '%s' "$HYDRA_DIGEST" > "$RUNNER_TEMP/hydra-digests/$HYDRA_COMPONENT-$HYDRA_ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.component }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/hydra-digests/*
          retention-days: 1
  manifests:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/hydra-digests
      - name: Publish manifests for both CPU architectures
        run: |
          hydra_tag=sha-${GITHUB_SHA:0:12}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then hydra_tag=${GITHUB_REF_NAME}; fi
          for hydra_component in api agent web; do
            hydra_image="ghcr.io/${GITHUB_REPOSITORY,,}/$hydra_component"
            hydra_amd=$(cat "$RUNNER_TEMP/hydra-digests/$hydra_component-amd64")
            hydra_arm=$(cat "$RUNNER_TEMP/hydra-digests/$hydra_component-arm64")
            [[ "$hydra_amd" =~ ^sha256:[a-f0-9]{64}$ && "$hydra_arm" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker buildx imagetools create -t "$hydra_image:$hydra_tag" "$hydra_image@$hydra_amd" "$hydra_image@$hydra_arm"
          done
