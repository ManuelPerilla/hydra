[package]
name = "hydra-chaos-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "A namespace-confined Kubernetes chaos worker for Hydra"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
hmac = "0.12.1"
k8s-openapi = { version = "0.25.0", features = ["v1_32"] }
kube = { version = "1.1.0", default-features = false, features = ["client", "rustls-tls"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.11.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "net", "sync", "time", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }
uuid = { version = "1.18.1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
