apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudflared, namespace: hydra-system}
spec:
  replicas: 2
  selector: {matchLabels: {app: cloudflared}}
  template:
    metadata: {labels: {app: cloudflared}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: tunnel
          image: cloudflare/cloudflared:2026.9.1
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: hydra-tunnel, key: TUNNEL_TOKEN}}
          ports: [{name: metrics, containerPort: 2000}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe: {httpGet: {path: /ready, port: metrics}}
          livenessProbe: {httpGet: {path: /ready, port: metrics}, periodSeconds: 15}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
